name: 衛星の軌道データを更新

on:
  schedule:
    - cron: '17 */6 * * *'   # 6時間ごと（UTC）
  workflow_dispatch:          # 手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CelesTrak から ISS と天宮の軌道データを取得
        run: |
          set -euo pipefail
          : > tle.new
          for id in 25544 48274; do
            curl -fsSL --retry 3 --retry-delay 10 \
              -A "hoshiasobi-sorashirabe/1.0 (GitHub Actions)" \
              "https://celestrak.org/NORAD/elements/gp.php?CATNR=${id}&FORMAT=TLE" \
              | tr -d '\r' >> tle.new
          done
          # 取得に失敗した場合は前のデータを残す
          grep -q '^1 25544' tle.new
          mv tle.new tle.txt

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add tle.txt
          git diff --cached --quiet || git commit -m "軌道データを更新"
          git push
