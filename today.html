<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の星空">
<title>今日の星空</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #121a3c;
  --panel: #19224a;
  --ink: #eee8d4;
  --dim: #a3abd0;
  --faint: #6c76a6;
  --rim: #34407a;
  --moon: #f4dc95;
  --moon-dark: #2a3360;
  --gold: #f4dc95;
  --sky-night: #0d1433;
  --sky-twilight: #17224f;
  --sky-dusk: #2a3a72;
  --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html.red { filter: grayscale(1) sepia(1) saturate(9) hue-rotate(-48deg) brightness(.62); }
html, body { margin: 0; background: var(--bg); }
body { color: var(--ink); font-family: var(--gothic); font-size: 16px; line-height: 1.7; -webkit-text-size-adjust: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 18px 18px 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--mincho); font-size: 13px; color: var(--dim); letter-spacing: .08em; margin: 0; }
.place { font-size: 13px; color: var(--dim); }

.dayrow { display: flex; align-items: center; gap: 6px; margin: 14px 0 0; }
.day { flex: 1; }
.day h1 { font-family: var(--mincho); font-weight: 700; font-size: 34px; line-height: 1.2; margin: 0; letter-spacing: .02em; }
.day h1 small { font-size: 15px; font-weight: 500; color: var(--dim); margin-left: 4px; letter-spacing: 0; }
.navbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rim); background: transparent; font-size: 20px; line-height: 1; }
.navbtn:active { background: var(--panel); }
#todayBtn { border: 1px solid var(--rim); background: transparent; border-radius: 22px; height: 36px; padding: 0 14px; font-size: 14px; }

.lead { font-family: var(--mincho); font-weight: 700; font-size: 26px; line-height: 1.45; margin: 22px 0 6px; color: var(--gold); text-wrap: balance; }
.leadSub { margin: 0 0 16px; color: var(--ink); font-size: 15px; }

#chartBox { margin: 0 -18px; scroll-margin-top: env(safe-area-inset-top, 0px); }
#chart { display: block; width: 100%; height: auto; }
#chart .clines polyline { fill: none; stroke: #5d6ab0; stroke-width: 1; opacity: .55; }
#chart .stars circle { fill: #fffaf0; }
#chart .cnames text { fill: #7f8ac0; font-size: 12px; font-family: var(--gothic); text-anchor: middle; opacity: .8; }
#chart .snames text { fill: #c9cde6; font-size: 12px; font-family: var(--gothic); }
#chart .pname { fill: #fff3d0; font-size: 14px; font-weight: 500; font-family: var(--gothic); }
#chart .pname.faint { fill: #8fa0c8; font-size: 11px; }
#chart .moonname { fill: var(--moon); }
#chart .ring { fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-dasharray: 5 5; opacity: .9; }
#chart .dir { fill: var(--gold); font-size: 16px; font-family: var(--mincho); font-weight: 700; text-anchor: middle; }
#chart .dir.minor { font-size: 12px; fill: var(--dim); font-weight: 500; }
#chart .ground { fill: #0a0f24; }
#chart .altline { fill: none; stroke: #2c3770; stroke-width: 1; stroke-dasharray: 2 4; }
#chart .hand line { stroke: var(--dim); stroke-width: 1.2; }
#chart .hand text { fill: var(--dim); font-size: 12px; font-family: var(--gothic); text-anchor: end; }
.eyeNote { margin: 6px 0 0; font-size: 14px; color: var(--ink); }
#chart .satpath { fill: none; stroke: #9fe3c8; stroke-width: 2; stroke-linecap: round; }
#chart .satpath.shadow { stroke: #9fe3c8; stroke-width: 1; stroke-dasharray: 3 4; opacity: .45; }
#chart .satname { fill: #9fe3c8; font-size: 13px; font-weight: 500; font-family: var(--gothic); }
#chart .satnow { fill: #ffffff; stroke: #9fe3c8; stroke-width: 2; }
#chart .sattime { fill: #cfeee2; font-size: 14px; font-weight: 500; font-family: var(--gothic); text-anchor: middle; }
#chart .satarrow { fill: #9fe3c8; }
.makeImg { margin-top: 10px; }
.modal { position: fixed; inset: 0; background: rgba(5, 8, 22, .82); display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.modal[hidden] { display: none; }
.sheet { background: var(--panel); border: 1px solid var(--rim); border-radius: 14px; padding: 14px; max-width: 640px; width: 100%; }
.sheet img { display: block; width: 100%; height: auto; border-radius: 6px; }
.mnote { font-size: 13px; color: var(--dim); margin: 10px 0; }
.mrow { display: flex; gap: 8px; flex-wrap: wrap; }
.mrow .chip { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; }
.chip.primary { background: var(--rim); }
#chart .altmark { fill: var(--faint); font-size: 11px; font-family: var(--gothic); }

.ctrl { padding: 10px 18px 0; }
.ctrlrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tl { font-family: var(--mincho); font-size: 18px; font-weight: 700; }
.ts { font-size: 13px; color: var(--dim); margin-left: 6px; }
.seg { display: inline-flex; border: 1px solid var(--rim); border-radius: 20px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; color: var(--dim); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--rim); color: var(--ink); }
.seg button:disabled { opacity: .4; }
input[type=range] { width: 100%; margin: 10px 0 0; accent-color: var(--gold); height: 30px; }

section { margin-top: 30px; }
h2 { font-family: var(--mincho); font-weight: 700; font-size: 19px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rim); }

#more, #sats { list-style: none; margin: 0; padding: 0; }
#more li + li, #sats li + li { border-top: 1px solid #263064; }
#sats li.none { padding: 6px 0; color: var(--dim); font-size: 14px; }
.satStatus { margin: 8px 0 0; font-size: 12px; color: var(--faint); }
.hl { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; }
.hl:disabled { cursor: default; opacity: 1; }
.hl-t { display: block; font-weight: 500; font-size: 16px; }
.hl-d { display: block; color: var(--dim); font-size: 14px; }
.hl-go { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--gold); border-bottom: 1px solid currentColor; }

.moonrow { display: flex; gap: 16px; align-items: center; }
.moonrow .mn { font-family: var(--mincho); font-weight: 700; font-size: 22px; line-height: 1.3; }
.moonrow .ma, .moonrow .mt { font-size: 14px; color: var(--dim); }

#planets { list-style: none; margin: 0; padding: 0; }
#planets li { display: grid; grid-template-columns: 12px 4.2em 1fr; gap: 8px; align-items: baseline; padding: 6px 0; }
#planets .dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
#planets .pl-n { font-weight: 500; }
#planets .pl-w { font-size: 14px; color: var(--ink); }
#planets li.off .pl-n, #planets li.off .pl-w { color: var(--faint); }
#planets li.faint .pl-n { color: var(--dim); }

dl#times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 0; }
dl#times dt { font-size: 13px; color: var(--dim); }
dl#times dd { margin: 0; font-family: var(--mincho); font-size: 22px; font-weight: 700; }

.consts { margin: 0; }
footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--rim); font-size: 13px; color: var(--dim); }
.frow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.chip { border: 1px solid var(--rim); background: transparent; border-radius: 18px; padding: 6px 14px; font-size: 13px; min-height: 36px; }
.chip[aria-pressed="true"] { background: #5a1c1c; border-color: #a33; }
#placeMsg { min-height: 1em; margin: 0 0 8px; }
.note { margin: 0; color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <p class="brand">今日の星空</p>
    <span class="place" id="place"></span>
  </div>
  <div class="dayrow">
    <button class="navbtn" id="prev" aria-label="前の日">‹</button>
    <div class="day"><h1><span id="date"></span><small id="weekday"></small></h1></div>
    <button id="todayBtn" hidden>今日へ</button>
    <button class="navbtn" id="next" aria-label="次の日">›</button>
  </div>

  <p class="lead" id="lead"></p>
  <p class="leadSub" id="leadSub"></p>

  <div id="chartBox">
    <svg id="chart" role="img" aria-label="星図"></svg>
    <div class="ctrl">
      <div class="ctrlrow">
        <div><span class="tl" id="timeLabel"></span><span class="ts" id="timeSub"></span></div>
        <div class="seg" role="group" aria-label="星図の表示">
          <button id="modeDir" aria-pressed="false">見どころの方向</button>
          <button id="modeEye" aria-pressed="false">肉眼の見え方</button>
          <button id="modeAll" aria-pressed="false">空全体</button>
        </div>
      </div>
      <input type="range" id="slider" aria-label="時刻">
      <p class="eyeNote" id="eyeNote" hidden></p>
      <button class="chip makeImg" id="makeImg">投稿用の画像を作る</button>
    </div>
  </div>

  <section id="moreWrap">
    <h2>ほかの見どころ</h2>
    <ul id="more"></ul>
  </section>

  <section>
    <h2>今夜の月</h2>
    <div class="moonrow">
      <div id="moonIcon"></div>
      <div>
        <div class="mn" id="moonName"></div>
        <div class="ma" id="moonAge"></div>
        <div class="mt" id="moonTimes"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>惑星</h2>
    <ul id="planets"></ul>
  </section>

  <section>
    <h2>人工衛星</h2>
    <ul id="sats" class="hllist"></ul>
    <p class="satStatus" id="satStatus" role="status"></p>
  </section>

  <section>
    <h2>空の時刻</h2>
    <dl id="times"></dl>
  </section>

  <section>
    <h2>夕方、高く見える星座</h2>
    <p class="consts" id="consts"></p>
  </section>

  <footer>
    <div class="frow">
      <span>場所</span>
      <button class="chip" id="naha">那覇</button>
      <button class="chip" id="here">現在地を使う</button>
      <button class="chip" id="red" aria-pressed="false">赤色ライト</button>
    </div>
    <p id="placeMsg" role="status"></p>
    <p class="note">「空全体」は南を下にして、寝ころんで見上げた向きです。位置は簡易計算のため、月で0.1°ほどの誤差があります。</p>
  </footer>
</main>
<div class="modal" id="imgModal" hidden>
  <div class="sheet" role="dialog" aria-label="投稿用の画像">
    <img id="imgPreview" alt="星図の画像">
    <p class="mnote">今の星図をそのまま画像にしました。時刻や表示を変えたら、作り直してください。</p>
    <div class="mrow">
      <button class="chip primary" id="imgShare">共有・写真に保存</button>
      <a class="chip" id="imgSave">ダウンロード</a>
      <button class="chip" id="imgClose">閉じる</button>
    </div>
  </div>
</div>

      const c = Math.cos(a) * Math.cos(d);
      const k = 2 / (1 + c);
      return { c, x: W / 2 + s * k * Math.cos(a) * Math.sin(d), y: base - s * k * Math.sin(a) };
    };
    return {
      W, H: Hh, clipAlt: -3, base,
      p(alt, az) { const q = raw(alt, az); return [q.x, q.y]; },
      inside(alt, az) {
        if (alt < -3) return false;
        const q = raw(alt, az);
        return q.c > -0.3 && q.x > -30 && q.x < W + 30 && q.y > -30;
      },
      scale: 1.35,
    };
  }

  // 肉眼に近い見え方：標準レンズ相当（横約45°）の透視投影
  function eyeProjector(center) {
    const W = 600, Hh = 400, FOV = 45, rad = Math.PI / 180;
    const s = (W / 2) / Math.tan(FOV / 2 * rad);
    const a0 = center.alt * rad;
    const raw = (alt, az) => {
      const d = (((az - center.az + 540) % 360) - 180) * rad, a = alt * rad;
      const c = Math.sin(a0) * Math.sin(a) + Math.cos(a0) * Math.cos(a) * Math.cos(d);
      const x = Math.cos(a) * Math.sin(d) / c;
      const y = (Math.cos(a0) * Math.sin(a) - Math.sin(a0) * Math.cos(a) * Math.cos(d)) / c;
      return { c, x: W / 2 + s * x, y: Hh / 2 - s * y };
    };
    return {
      W, H: Hh, eye: true, pxPerDeg: s * rad,
      p(alt, az) { const q = raw(alt, az); return [q.x, q.y]; },
      inside(alt, az) { if (alt < -3) return false; const q = raw(alt, az); return q.c > 0.3 && q.x > -20 && q.x < W + 20 && q.y > -20 && q.y < Hh + 20; },
      scale: 1,
    };
  }

  const handWord = M.handWord;

  function moonPath(r, elong) {
    const c = Math.cos(elong * Math.PI / 180);
    const rx = Math.abs(c) * r;
    const sweep = c > 0 ? 0 : 1;      // 三日月側は欠け際が太陽側へふくらむ
    // c>0 は太陽に近い（細い月）→ 欠け際が太陽側
    return `M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx.toFixed(2)},${r} 0 0 ${c > 0 ? 0 : 1} 0,${-r}Z`;
  }
  function moonSvg(cx, cy, r, elong, angDeg) {
    return `<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${angDeg.toFixed(1)})">
      <circle r="${r}" fill="var(--moon-dark)"/>
      <path d="${moonPath(r, elong)}" fill="var(--moon)"/></g>`;
  }

  function drawChart() {
    const t = viewT, ctx = S.context(t, obs);
    let center = null, P;
    if (mode === 'eye') {
      let mid = { alt: 30, az: 180 };
      if (focus) { const a = focus.haAt(t), b = focus.hbAt(t); mid = towards(a, b, S.sep({ ra: a.az, dec: a.alt }, { ra: b.az, dec: b.alt }) / 2); }
      center = { az: mid.az, alt: mid.alt < 27 ? 13 : mid.alt };   // 低いときは地平線が入るように
      P = eyeProjector(center);
    } else {
      if (mode === 'dir' && focus) {
        const ha = focus.haAt(t);
        center = { az: ha.az, top: Math.min(85, ha.alt + 30) };
      }
      P = projector(mode === 'dir' && center ? 'dir' : 'all', center);
    }
    const parts = [];
    const sunAlt = S.altOf('Sun', t, obs);
    const skyTone = sunAlt > -6 ? 'var(--sky-dusk)' : sunAlt > -12 ? 'var(--sky-twilight)' : 'var(--sky-night)';

    if (P.W === P.H) {
      parts.push(`<circle cx="300" cy="300" r="282" fill="${skyTone}" stroke="var(--rim)" stroke-width="1.5"/>`);
    } else {
      parts.push(`<rect x="0" y="0" width="${P.W}" height="${P.H}" fill="${skyTone}"/>`);
    }

    // 星座線
    const linesOut = [];
    for (const [id, rank, lines] of LINES) {
      for (const ln of lines) {
        let seg = [];
        const flush = () => { if (seg.length > 1) linesOut.push(`<polyline points="${seg.join(' ')}"/>`); seg = []; };
        for (const [ra, dec] of ln) {
          const h = S.horiz({ ra, dec }, ctx);
          if (!P.inside(h.alt, h.az)) { flush(); continue; }
          const [x, y] = P.p(h.alt, h.az); seg.push(`${x.toFixed(1)},${y.toFixed(1)}`);
        }
        flush();
      }
    }
    if (!P.eye) parts.push(`<g class="clines">${linesOut.join('')}</g>`);

    // 星（肉眼モードでは空の明るさで見える等級を変える）
    const eyeLimit = sunAlt > -6 ? 1.5 : sunAlt > -12 ? 3.0 : 4.2;
    const stars = [];
    for (const [ra, dec, mag] of STARS) {
      const h = S.horiz({ ra, dec }, ctx);
      if (!P.inside(h.alt, h.az)) continue;
      const [x, y] = P.p(h.alt, h.az);
      if (P.eye) {
        // 街明かりのある空を想定し、4.2等まで。低空ほど暗く
        const ext = h.alt < 5 ? 1.5 : h.alt < 15 ? 0.7 : 0.25;
        const m = mag + ext;
        if (m > eyeLimit) continue;
        const r = Math.max(0.5, 2.0 - 0.38 * m);
        stars.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" opacity="${Math.min(1, 1.05 - m * 0.17).toFixed(2)}"/>`);
        continue;
      }
      const r = Math.max(0.55, (3.1 - 0.6 * mag)) * P.scale;
      const ext = h.alt < 10 ? 0.55 : 1;       // 低空は減光
      stars.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" opacity="${(Math.min(1, 1.15 - mag * 0.13) * ext).toFixed(2)}"/>`);
    }
    parts.push(`<g class="stars">${stars.join('')}</g>`);

    // 星座名
    const cl = [];
    const seen = new Set();
    for (const [id, rank, lines] of LINES) {
      if (rank > (P.W === P.H ? 1 : 2) || seen.has(id)) continue; seen.add(id);
      let x = 0, y = 0, z = 0;
      for (const ln of lines) for (const [ra, dec] of ln) { const r = Math.PI / 180; x += Math.cos(dec * r) * Math.cos(ra * r); y += Math.cos(dec * r) * Math.sin(ra * r); z += Math.sin(dec * r); }
      const ra = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360, dec = Math.atan2(z, Math.hypot(x, y)) * 180 / Math.PI;
      const h = S.horiz({ ra, dec }, ctx);
      if (h.alt < 6 || !P.inside(h.alt, h.az)) continue;
      const [px, py] = P.p(h.alt, h.az);
      cl.push(`<text x="${px.toFixed(1)}" y="${py.toFixed(1)}">${M.CONST_JA[id]}</text>`);
    }
    if (!P.eye) parts.push(`<g class="cnames">${cl.join('')}</g>`);

    // 一等星の名前
    const nm = [];
    for (const s of [...M.NAMED, ...M.CLUSTERS]) {
      const h = S.horiz(s, ctx);
      if (h.alt < 1 || !P.inside(h.alt, h.az)) continue;
      if (P.eye && !(focus && focus.names.includes(s.name))) continue;
      const [x, y] = P.p(h.alt, h.az);
      nm.push(`<text x="${(x + 6).toFixed(1)}" y="${(y - 5).toFixed(1)}">${s.name}</text>`);
    }
    parts.push(`<g class="snames">${nm.join('')}</g>`);

    // 惑星
    for (const p of M.PLANETS) {
      const eq = S.bodyEq(p.id, t), h = S.horiz(eq, ctx);
      if (!P.inside(h.alt, h.az) || h.alt < 0) continue;
      const [x, y] = P.p(h.alt, h.az);
      const faint = p.id === 'Uranus' || p.id === 'Neptune';
      if (P.eye && faint) continue;
      const pr = P.eye ? ({ Venus: 2.6, Jupiter: 2.2, Mars: 1.7, Saturn: 1.6, Mercury: 1.5 }[p.id]) : (faint ? 1.6 : 3.6) * P.scale;
      parts.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${pr}" fill="${p.color}" class="planet"/>`);
      parts.push(`<text class="pname${faint ? ' faint' : ''}" x="${(x + 7).toFixed(1)}" y="${(y + 4).toFixed(1)}">${p.name}</text>`);
    }

    // 人工衛星の通り道
    for (const s of satList) {
      const p = s.pass;
      if (Math.abs(t - p.maxT) > 20 * MIN) continue;
      let run = [], lit = null;
      const flush = () => { if (run.length > 1) parts.push(`<polyline class="satpath${lit ? '' : ' shadow'}" points="${run.join(' ')}"${lit ? ' marker-end="url(#satArrow)"' : ''}/>`); };
      let firstLit = null, lastPt = null;
      for (const q of p.fullPath) {
        if (!P.inside(q.alt, q.az)) { flush(); run = []; continue; }
        const [x, y] = P.p(q.alt, q.az);
        const pt = `${x.toFixed(1)},${y.toFixed(1)}`;
        if (lit !== null && q.lit !== lit) { run.push(pt); flush(); run = [pt]; } else run.push(pt);
        lit = q.lit;
        if (q.lit && !firstLit) firstLit = [x, y];
        if (q.lit) lastPt = [x, y];
      }
      flush();
      // 見え始め・いちばん高いところ・見え終わりに時刻と向きの矢印
      const near = tt => p.fullPath.reduce((a, b) => Math.abs(b.t - tt) < Math.abs(a.t - tt) ? b : a);
      const marks = [[p.start, true], [p.maxT, false], [p.end, false]];
      marks.forEach(([tt, isStart], k) => {
        // 同じ分の時刻が重なるときは真ん中を省く
        if (k === 1 && (M.hm(tt) === M.hm(p.start) || M.hm(tt) === M.hm(p.end))) return;
        const q = near(tt);
        if (!P.inside(q.alt, q.az)) return;
        const [x, y] = P.p(q.alt, q.az);
        const i = p.fullPath.indexOf(q);
        const q2 = p.fullPath[Math.min(p.fullPath.length - 1, i + 1)], q1 = p.fullPath[Math.max(0, i - 1)];
        const [x1, y1] = P.p(q1.alt, q1.az), [x2, y2] = P.p(q2.alt, q2.az);
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const c = Math.cos(ang), sn = Math.sin(ang);
        {
          const L = 9, Wd = 5;
          const tip = [x + c * L / 2, y + sn * L / 2], b1 = [x - c * L / 2 - sn * Wd, y - sn * L / 2 + c * Wd], b2 = [x - c * L / 2 + sn * Wd, y - sn * L / 2 - c * Wd];
          parts.push(`<polygon class="satarrow" points="${tip.map(v => v.toFixed(1))} ${b1.map(v => v.toFixed(1))} ${b2.map(v => v.toFixed(1))}"/>`);
        }
        // 文字は道すじの上側へ
        let nx = sn, ny = -c; if (ny > 0) { nx = -nx; ny = -ny; }
        let tx = x + nx * 18, ty = y + ny * 18 + 4;
        tx = Math.max(30, Math.min(P.W - 30, tx)); ty = Math.max(16, ty);
        const label = isStart ? `${s.short} ${M.hm(tt)}` : M.hm(tt);
        parts.push(`<text class="sattime" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}">${label}</text>`);
      });
      if (t >= p.fullPath[0].t && t <= p.fullPath[p.fullPath.length - 1].t) {
        const q = p.fullPath.reduce((a, b) => Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a);
        if (q.lit && P.inside(q.alt, q.az)) { const [x, y] = P.p(q.alt, q.az); parts.push(`<circle class="satnow" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`); }
      }
    }

    // 月
    const meq = S.moonTopo(t, obs), mh = S.horiz(meq, ctx);
    if (mh.alt > -0.5 && P.inside(mh.alt, mh.az)) {
      const [mx, my] = P.p(mh.alt, mh.az);
      const sh = S.horiz(S.bodyEq('Sun', t), ctx);
      // 太陽の方向は、月から少しだけ太陽へ寄せた点で求める（投影のゆがみを避ける）
      const tgt = towards(mh, sh, 5);
      const [sx, sy] = P.p(tgt.alt, tgt.az);
      const ang = Math.atan2(sy - my, sx - mx) * 180 / Math.PI;
      const el = S.sep(S.bodyEq('Sun', t), meq);
      if (P.eye) {
        const diam = 2 * Math.asin(1737.4 / meq.dist) * 180 / Math.PI;      // 視直径（度）
        const mr = diam / 2 * P.pxPerDeg;
        parts.push(`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${(mr * 5).toFixed(1)}" fill="url(#glow)"/>`);
        parts.push(moonSvg(mx, my, Math.max(2.2, mr), el, ang));
      } else {
        parts.push(moonSvg(mx, my, P.W === P.H ? 8 : 12, el, ang));
      }
    }


    // 地平線と方位
    if (P.eye) {
      const [, y0] = P.p(0, center.az);
      if (y0 < P.H) {
        parts.push(`<rect class="ground" x="0" y="${y0.toFixed(1)}" width="${P.W}" height="${(P.H - y0 + 1).toFixed(1)}"/>`);
        for (let az = 0; az < 360; az += 45) {
          if (!P.inside(0, az)) continue;
          const [x] = P.p(0, az);
          if (x < 14 || x > P.W - 14 || y0 + 20 > P.H) continue;
          parts.push(`<text class="dir" x="${x.toFixed(1)}" y="${(y0 + 20).toFixed(1)}">${M.dirName(az)}</text>`);
        }
      }
      // こぶし1つ（約10°）のものさし
      const L = 10 * P.pxPerDeg, bx = P.W - 16 - L, by = 22;
      parts.push(`<g class="hand"><line x1="${bx.toFixed(1)}" y1="${by}" x2="${(bx + L).toFixed(1)}" y2="${by}"/><line x1="${bx.toFixed(1)}" y1="${by - 5}" x2="${bx.toFixed(1)}" y2="${by + 5}"/><line x1="${(bx + L).toFixed(1)}" y1="${by - 5}" x2="${(bx + L).toFixed(1)}" y2="${by + 5}"/><text x="${(bx + L).toFixed(1)}" y="${by + 20}">こぶし1つ（約10°）</text></g>`);
      if (focus && focus.sat) {
        $('eyeNote').textContent = `${focus.names[0]}は約${Math.max(1, Math.round((focus.sat.end - focus.sat.start) / MIN))}分かけて、星のあいだをすーっと動いていきます。月は実際の大きさで描いています。`;
      } else if (focus) {
        const a = focus.haAt(t), b = focus.hbAt(t);
        const d = S.sep({ ra: a.az, dec: a.alt }, { ra: b.az, dec: b.alt });
        $('eyeNote').textContent = `${focus.names.join('と')}の間は約${d.toFixed(1)}°。腕をのばして${handWord(d)}です。月は実際の大きさで描いています。`;
      } else $('eyeNote').textContent = '月は実際の大きさで描いています。';
    } else if (P.W === P.H) {
      const lab = [['北', 0], ['東', 90], ['南', 180], ['西', 270], ['北東', 45], ['南東', 135], ['南西', 225], ['北西', 315]];
      for (const [n, az] of lab) {
        const a = az * Math.PI / 180, r = 282 + (n.length > 1 ? 0 : 0);
        const x = 300 - (r - 16) * Math.sin(a), y = 300 - (r - 16) * Math.cos(a);
        parts.push(`<text class="dir${n.length > 1 ? ' minor' : ''}" x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}">${n}</text>`);
      }
    } else {
      const y0 = P.p(0, center.az)[1];
      parts.push(`<rect class="ground" x="0" y="${y0.toFixed(1)}" width="${P.W}" height="${(P.H - y0).toFixed(1)}"/>`);
      for (let az = 0; az < 360; az += 45) {
        const [x] = P.p(0, az);
        if (x < 10 || x > P.W - 10) continue;
        parts.push(`<text class="dir" x="${x.toFixed(1)}" y="${(y0 + 22).toFixed(1)}">${M.dirName(az)}</text>`);
      }
      // 高度の目安線（ステレオ投影では弧になる）
      for (const alt of [10, 20, 30, 40, 50, 60, 70, 80]) {
        const pts = [];
        for (let d = -100; d <= 100; d += 4) {
          const az = (center.az + d + 360) % 360;
          if (!P.inside(alt, az)) continue;
          const [x, y] = P.p(alt, az); pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
        }
        if (pts.length < 2) continue;
        parts.push(`<polyline class="altline" points="${pts.join(' ')}"/>`);
        const [lx, ly] = pts[0].split(',').map(Number);
        const [rx, ry] = pts[pts.length - 1].split(',').map(Number);
        const [x, y] = lx < 4 ? [6, ly] : [lx + 4, ly];
        if (y > 12 && y < P.base - 6) parts.push(`<text class="altmark" x="${x.toFixed(1)}" y="${(y - 4).toFixed(1)}">${alt}°</text>`);
      }
    }

    const svg = $('chart');
    svg.setAttribute('viewBox', `0 0 ${P.W} ${P.H}`);
    svg.innerHTML = `<defs><radialGradient id="glow"><stop offset="0" stop-color="#f4dc95" stop-opacity=".28"/><stop offset="1" stop-color="#f4dc95" stop-opacity="0"/></radialGradient><marker id="satArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fe3c8"/></marker></defs>` + parts.join('');
    $('eyeNote').hidden = !P.eye;
    const sunNote = sunAlt > -6 ? '（まだ明るい空）' : sunAlt > -12 ? '（薄明）' : '';
    $('timeLabel').textContent = `${M.hm(t)} の空${sunNote}`;
    const off = Math.round((t - report.sunset) / MIN);
    $('timeSub').textContent = `日の入りから${Math.floor(off / 60) ? Math.floor(off / 60) + '時間' : ''}${off % 60 ? (off % 60) + '分' : ''}後`;
    $('modeAll').setAttribute('aria-pressed', mode === 'all');
    $('modeDir').setAttribute('aria-pressed', mode === 'dir');
    $('modeDir').disabled = !focus;
    $('modeEye').setAttribute('aria-pressed', mode === 'eye');
  }

  // 高度方位上で a から b の方向へ deg 度進んだ点
  function towards(a, b, deg) {
    const r = Math.PI / 180;
    const va = [Math.cos(a.alt * r) * Math.cos(a.az * r), Math.cos(a.alt * r) * Math.sin(a.az * r), Math.sin(a.alt * r)];
    const vb = [Math.cos(b.alt * r) * Math.cos(b.az * r), Math.cos(b.alt * r) * Math.sin(b.az * r), Math.sin(b.alt * r)];
    const dot = va.reduce((s, v, i) => s + v * vb[i], 0);
    const om = Math.acos(Math.max(-1, Math.min(1, dot)));
    if (om < 1e-6) return a;
    const f = Math.min(1, deg * r / om);
    const s1 = Math.sin((1 - f) * om) / Math.sin(om), s2 = Math.sin(f * om) / Math.sin(om);
    const v = va.map((x, i) => s1 * x + s2 * vb[i]);
    return { alt: Math.asin(v[2]) / r, az: ((Math.atan2(v[1], v[0]) / r) + 360) % 360 };
  }

  function makeFocus(h) {
    if (h && h.sat) {
      const pt = { alt: h.sat.max.alt, az: h.sat.max.az };
      return { t: h.sat.maxT, sat: h.sat, names: [h.satName], haAt: () => pt, hbAt: () => pt };
    }
    if (!h || !h.focus) return null;
    const look = (o, t) => o.kind === 'moon' ? S.moonTopo(t, obs) : o.kind === 'planet' ? S.bodyEq(o.id, t) : o;
    return {
      t: h.focus.t,
      names: [h.focus.a.name, h.focus.b.name],
      haAt: t => S.horiz(look(h.focus.a, t), S.context(t, obs)),
      hbAt: t => S.horiz(look(h.focus.b, t), S.context(t, obs)),
    };
  }

  function renderSats() {
    const st = satState;
    let msg = '';
    if (st.status === 'loading') msg = '軌道データを読み込んでいます…';
    else if (st.status === 'error') msg = '軌道データを読み込めませんでした。電波のある場所で開き直すと表示されます。';
    else if (st.status === 'stale') msg = `最新の軌道データを読み込めなかったため、前回のデータ（${fmtFetched(dataTime(st))}時点）で計算しています。`;
    else msg = `軌道データ：CelesTrak（${fmtFetched(dataTime(st))}時点）`;
    if (satList.outOfRange) msg += ' 日付がデータから離れすぎているため、この日は予報できません（前後10日ほどまで）。';
    $('satStatus').textContent = msg;
    const hs = report.highlights.filter(h => h.type === 'sat').sort((a, b) => a.sat.start - b.sat.start);
    $('sats').innerHTML = hs.length ? hs.map(h => `<li><button class="hl" data-sat="${h.satIndex}">
        <span class="hl-t">${esc(h.title)}</span><span class="hl-d">${esc(h.detail)}</span><span class="hl-go">星図で見る</span></button></li>`).join('')
      : (st.tles && !satList.outOfRange ? '<li class="none">今夜、見やすい通過はありません。</li>' : '');
  }

  // ---- 投稿用の画像 ----
  const STYLE_PROPS = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-opacity', 'opacity', 'font-size', 'font-family', 'font-weight', 'text-anchor'];
  function chartTitle() {
    const p = M.jstParts(viewT);
    const place = obs.name === '現在地' ? '' : `（${obs.name}）`;
    let sub = '';
    if (focus && focus.sat) sub = `${focus.names[0]}　${M.hm(focus.sat.start)}〜${M.hm(focus.sat.end)}`;
    else if (focus) sub = focus.names.join('と');
    // 日付は観察した夜の日付ではなく、表示している時刻の日付
    return { main: `${p.m}月${p.d}日 ${M.hm(viewT)}ごろの空${place}`, sub };
  }
  async function makeImage() {
    const src = $('chart');
    const vb = src.viewBox.baseVal, scale = 3;
    const W = vb.width * scale, Hh = vb.height * scale;
    const clone = src.cloneNode(true);
    const a = src.querySelectorAll('*'), b = clone.querySelectorAll('*');
    a.forEach((el, i) => {
      const cs = getComputedStyle(el);
      b[i].setAttribute('style', STYLE_PROPS.map(k => `${k}:${cs.getPropertyValue(k)}`).join(';'));
    });
    // 投稿用には高度の目安線を外してすっきりさせる
    clone.querySelectorAll('.altline, .altmark').forEach(el => el.remove());
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', W); clone.setAttribute('height', Hh);
    // 見出し（左上）
    const tt = chartTitle(), font = "'Hiragino Mincho ProN','Yu Mincho',serif", gfont = "'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
    const head = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    head.innerHTML = `<text x="14" y="26" style="fill:#eee8d4;font-size:17px;font-family:${font};font-weight:700">${esc(tt.main)}</text>` +
      '';
    clone.appendChild(head);
    const data = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    const img = new Image();
    await new Promise((ok, ng) => { img.onload = ok; img.onerror = ng; img.src = data; });
    const cv = document.createElement('canvas'); cv.width = W; cv.height = Hh;
    const g = cv.getContext('2d');
    g.fillStyle = '#0d1433'; g.fillRect(0, 0, W, Hh);
    g.drawImage(img, 0, 0, W, Hh);
    return new Promise(ok => cv.toBlob(ok, 'image/png'));
  }
  let lastImage = null, lastUrl = null;
  $('makeImg').onclick = async () => {
    $('makeImg').disabled = true;
    try {
      const blob = await makeImage();
      const p = M.jstParts(viewT);
      const name = `hoshizora-${p.y}${String(p.m).padStart(2, '0')}${String(p.d).padStart(2, '0')}-${String(p.h).padStart(2, '0')}${String(p.mi).padStart(2, '0')}.png`;
      lastImage = new File([blob], name, { type: 'image/png' });
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      const url = lastUrl = URL.createObjectURL(blob);
      $('imgPreview').src = url;
      $('imgSave').href = url; $('imgSave').download = name;
      $('imgShare').hidden = !(navigator.canShare && navigator.canShare({ files: [lastImage] }));
      $('imgModal').hidden = false;
    } catch (e) {
      console.error('makeImage', e && (e.message || e.type || e)); alert('画像を作れませんでした。');
    } finally { $('makeImg').disabled = false; }
  };
  $('imgShare').onclick = async () => { try { await navigator.share({ files: [lastImage] }); } catch (e) { } };
  $('imgClose').onclick = () => { $('imgModal').hidden = true; };
  $('imgModal').onclick = e => { if (e.target === $('imgModal')) $('imgModal').hidden = true; };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function run() {
    report = M.analyze(ymd[0], ymd[1], ymd[2], obs);
    const r = report;
    computeSats(r);
    satList.forEach((s, i) => r.highlights.push(satHighlight(s, i)));
    r.highlights.sort((a, b) => b.score - a.score);
    renderSats();
    const d = new Date(Date.UTC(ymd[0], ymd[1] - 1, ymd[2]));
    const isToday = todayJst().join() === ymd.join();
    $('date').textContent = `${ymd[1]}月${ymd[2]}日`;
    $('weekday').textContent = `（${WD[d.getUTCDay()]}）${isToday ? '今日' : ymd[0] + '年'}`;
    $('todayBtn').hidden = isToday;
    $('place').textContent = obs.name;

    const top = r.highlights[0];
    const planetsUp = r.planets.filter(p => p.status === 'evening' && !p.faint);
    $('lead').textContent = top ? top.title : planetsUp.length ? `夕方の空に${planetsUp.map(p => p.name).join('と')}` : `今夜は${r.moon.name}`;
    $('leadSub').textContent = top ? top.detail : '大きな出来事のない、ふだんの星空です。';

    // ほかの見どころ
    const rest = r.highlights.slice(1);
    $('moreWrap').hidden = rest.length === 0;
    $('more').innerHTML = rest.map((h, i) => `
      <li><button class="hl" data-i="${i + 1}" ${h.focus || h.sat ? '' : 'disabled'}>
        <span class="hl-t">${esc(h.title)}</span><span class="hl-d">${esc(h.detail)}</span>
        ${h.focus || h.sat ? '<span class="hl-go">星図で見る</span>' : ''}</button></li>`).join('');

    // 月
    const m = r.moon;
    $('moonIcon').innerHTML = `<svg viewBox="-30 -30 60 60" width="64" height="64" aria-hidden="true">${moonSvg(0, 0, 26, m.elong, m.waxing ? 0 : 180)}</svg>`;
    $('moonName').textContent = m.name;
    $('moonAge').textContent = `月齢 ${m.age.toFixed(1)}　輝いている部分 ${Math.round(m.illum * 100)}%`;
    const ev = [];
    if (m.upAtSunset && m.set) ev.push(`日の入りのときすでに空に。月の入り ${M.hm(m.set)}`);
    else if (m.rise) ev.push(`月の出 ${M.hm(m.rise)}` + (m.set && m.set > m.rise ? `　月の入り ${M.hm(m.set)}` : ''));
    $('moonTimes').textContent = ev.join('　');

    // 惑星
    $('planets').innerHTML = r.planets.map(p => `
      <li class="${p.status === 'none' ? 'off' : ''}${p.faint ? ' faint' : ''}">
        <span class="dot" style="background:${p.color}"></span>
        <span class="pl-n">${p.name}</span>
        <span class="pl-w">${esc(p.when)}${p.faint && p.status !== 'none' ? '（双眼鏡・望遠鏡で）' : ''}</span></li>`).join('');

    // 時刻
    $('times').innerHTML = [
      ['日の入り', r.sunset], ['暗くなる（薄明の終わり）', r.dark], ['明るくなりはじめ', r.dawn], ['日の出', r.sunrise],
    ].map(([k, t]) => `<div><dt>${k}</dt><dd>${t ? M.hm(t) : '—'}</dd></div>`).join('');

    $('consts').textContent = r.constellations.slice(0, 6).map(c => c.name).join('、') || '—';

    // 星図
    focus = makeFocus(top);
    mode = focus ? 'dir' : 'all';
    viewT = focus ? focus.t : r.evening;
    const slider = $('slider');
    slider.min = 0; slider.max = Math.round((r.sunrise - r.sunset) / MIN); slider.step = 10;
    slider.value = Math.round((viewT - r.sunset) / MIN);
    drawChart();
  }

  // ---- 操作 ----
  $('prev').onclick = () => shiftDay(-1);
  $('next').onclick = () => shiftDay(1);
  $('todayBtn').onclick = () => { ymd = todayJst(); run(); };
  $('slider').oninput = e => { viewT = report.sunset + Number(e.target.value) * MIN; drawChart(); };
  $('modeAll').onclick = () => { mode = 'all'; drawChart(); };
  $('modeEye').onclick = () => { mode = 'eye'; drawChart(); };
  $('modeDir').onclick = () => { if (focus) { mode = 'dir'; drawChart(); } };
  $('more').onclick = e => {
    const b = e.target.closest('.hl'); if (!b || b.disabled) return;
    showOnChart(report.highlights[Number(b.dataset.i)]);
  };
  $('sats').onclick = e => {
    const b = e.target.closest('.hl'); if (!b) return;
    showOnChart(report.highlights.find(h => h.type === 'sat' && h.satIndex === Number(b.dataset.sat)));
  };
  function showOnChart(h) {
    if (!h) return;
    focus = makeFocus(h); if (mode !== 'eye') mode = 'dir'; viewT = focus.t;
    $('slider').value = Math.round((viewT - report.sunset) / MIN);
    drawChart();
    $('chartBox').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  $('here').onclick = () => {
    if (!navigator.geolocation) { $('placeMsg').textContent = 'この端末では現在地を使えません。'; return; }
    $('placeMsg').textContent = '現在地を取得しています…';
    navigator.geolocation.getCurrentPosition(p => {
      obs = { name: '現在地', lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) };
      store.set('midokoro-obs', obs); $('placeMsg').textContent = ''; run();
    }, () => { $('placeMsg').textContent = '現在地を取得できませんでした。位置情報の許可を確認してください。'; });
  };
  $('naha').onclick = () => { obs = NAHA; store.set('midokoro-obs', obs); $('placeMsg').textContent = ''; run(); };
  const setRed = on => { document.documentElement.classList.toggle('red', on); $('red').setAttribute('aria-pressed', on); store.set('midokoro-red', on); };
  $('red').onclick = () => setRed(!document.documentElement.classList.contains('red'));
  setRed(store.get('midokoro-red', false));

  run();
  loadTLE().then(() => {
    // 読み込み中に操作していたら星図の状態を保つ
    const keep = { mode, viewT, focus };
    const touched = report && (viewT !== (focus ? focus.t : report.evening));
    run();
    if (touched) { mode = keep.mode; viewT = keep.viewT; if (keep.focus && !keep.focus.sat) focus = keep.focus; $('slider').value = Math.round((viewT - report.sunset) / MIN); drawChart(); }
  });
})();

</script>
</body>
</html>
